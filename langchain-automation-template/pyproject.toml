[project]
name = "langchain-automation-template"
version = "0.1.0"
description = "A modular and production-ready template for developing intelligent agent systems."
readme = "README.md" # Assuming a README will be added later
requires-python = ">=3.8"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "langchain",
    "langgraph",
    "openai",
    "anthropic",
    "google-generativeai",
    "PyYAML",
    "python-dotenv",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff", # Example linter
    "mypy", # Example type checker
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."] # searches in the root directory
include = ["core*", "agents*", "tools*", "workflows*", "examples*", "config*"] # include these packages
