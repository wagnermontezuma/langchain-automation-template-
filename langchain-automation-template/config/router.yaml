  #   - name: "strategy_A"
  #     weight: 0.5
  #     rules_variant: "routing_rules_variant_A" # Points to another section in this YAML or a separate file
  #   - name: "strategy_B"
  #     weight: 0.5
  #     rules_variant: "default" # Uses the main routing_rules
